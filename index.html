<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#14213d;--mute:#4a5568;--line:#cbd5e1;--brand:#12355b;--sun:#f2b705;--on-sun:#14213d;--ok:#e6f4ea;--info:#e8f0fe;--warn:#fff4d6;

:root[data-theme="dark"]{--bg:#0f1b2d;--card:#172640;--ink:#f1f5f9;--mute:#b6c2d4;--line:#3a4d6b;--brand:#9cc3f0;--ok:#16352a;--info:#1c3358;--warn:#4a3b0f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;color:var(--brand);margin:0 0 12px}
h1{font-size:1.7rem}h2{font-size:1.45rem}h2:focus{outline:none}h3{font-size:1.1rem;margin:20px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:16px 0}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand)}
.mute{color:var(--mute);font-size:.9rem}
.lang{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.lang button{padding:8px 14px;min-height:44px}.lang button[aria-pressed=true]{background:var(--brand);color:var(--card)}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;min-height:56px}
.opt:has(input:checked){border-color:var(--brand);background:var(--info)}
.opt input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--brand)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=number],select{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:52px}
button{font:inherit;font-weight:700;border-radius:8px;padding:14px 22px;min-height:52px;cursor:pointer;border:2px solid var(--brand);background:var(--card);color:var(--brand)}
.go{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.box{border-radius:10px;padding:16px;margin:12px 0}.ok{background:var(--ok)}.info{background:var(--info)}.warn{background:var(--warn)}
ul{padding-left:1.2em}li{margin:6px 0}
.chk{list-style:none;padding:0}.chk li{display:flex;gap:10px;align-items:flex-start}.chk input{width:22px;height:22px;margin-top:4px;flex:none;accent-color:var(--brand)}
a{color:var(--brand)}.err{color:#b00020;font-weight:600}
@media print{.noprint{display:none}body{background:#fff;color:#000}.card{border:0;padding:0}}
.pl{margin:10px 0}.pl a{display:inline-block;font-weight:700;margin:6px 14px 0 0;padding:6px 0}.zr{display:flex;gap:10px;flex-wrap:wrap}.zr input{flex:1;min-width:140px}
</style>

2:"Head Start (ages 3 to 5)",p3:"Early Head Start, which can serve pregnant women",p4:"Early Head Start (birth to 3) or Head Start (3 to 5)",
dh:"Papers to gather",dp:"Check them off as you find them. You do not need all of them to start. Programs may ask for other forms too.",
d1:["Proof of your child’s age.","Any one: birth certificate, immunization record, insurance card or letter, or passport. If you do not have one, tell the program. Age proof is not required if it is a barrier."],
d2:["Proof you are in temporary housing.","A written statement from a shelter, service agency, or school staff member, or a signed statement from you."],
d3:["Proof of foster care.","A court order, a government document, or proof of foster care payments."],
d4:["Proof of benefits.","A benefits letter or award letter for cash assistance (TANF), SNAP, or SSI, or a copy of your card showing you are enrolled."],
d5:["Proof of income.","Any that apply: tax form (1040 or W-2), recent pay stubs, a written statement from your employer, unemployment papers, Social Security, or child support or alimony records. If you have no income, ask the program how to write a statement saying so."],
d6:["Proof of housing costs.","For example a lease, rent receipts, or a mortgage statement."],

wh:"Pwogram toupre w",wz:"Antre kòd postal ou pou w wè pwogram ki pi pre yo.",wzp:"Kòd postal",wf2:"Chèche pwogram",wbad:"Tanpri antre yon kòd postal 5 chif.",wnyc:"Lis sa a kouvri sèlman vil New York. Itilize Head Start Center Locator nan pwochen etap yo.",wnone:"Nou pa jwenn pwogram nan lis nou an. Itilize Head Start Center Locator nan pwochen etap yo.",wcall:"Rele",wapp:"Pou aplike, rele",wdir:"Direksyon",wnop:"Pa gen nimewo telefòn. Itilize Center Locator.",wmore:"Wè plis",wcaut:"Pi pre yo an premye, selon kòd postal. Rele anvan w ale. Plas ki disponib, orè, ak lang yo pale pa sou lis sa a, epi enfòmasyon yo ka pa ajou.",oh:"Lòt papye pwogram yo souvan mande lè w enskri",op:"Souvan yo bezwen yo apre yo aksepte w. Chak pwogram deside, kidonk mande pwogram ou a ki youn li bezwen. Sa baze sou règ sante NYC ak lis enskripsyon lekòl piblik NYC yo.",o1:["Fòm egzamen sante pitit la.","Yon fòm egzamen fizik (yo rele CH-205) doktè pitit ou ranpli, fèt nan dènye ane a. NYC egzije li pou timoun ki antre nan gadri oswa lekòl pou premye fwa."],o2:["Dosye vaksen.","Eta New York egzije kèk vaksen pou gadri, Head Start, 3-K, ak Pre-K. Doktè pitit ou ka ba w dosye a."],o3:["Prèv adrès.","Pwogram lekòl piblik NYC mande de, tankou yon kontra lwaye, yon relve ipotèk, yon bòdwo sèvis piblik oswa yon resi lwaye nan dènye 60 jou yo, oswa yon kat idantite gouvènman ki gen adrès ou, ki gen ladan IDNYC. Pwogram Head Start yo ka mande yon bagay ki sanble."],o4:["Papye gadyen legal.","Si se yon moun ki pa paran an k ap enskri timoun nan."],o5:["Evalyasyon oswa plan sèvis,","si pitit ou gen youn pou yon andikap oswa yon reta (tankou yon IEP)."],o6:"<strong>Lojman tanporè:</strong> Lekòl piblik NYC pa egzije prèv adrès, laj, ni vaksen pou timoun ki nan lojman tanporè, epi yo ede fanmi yo jwenn papye yo apre. Mande pwogram Head Start ou a si li ka fè menm bagay la.",ph:"Pwogram ki gen plis chans",p1:"Early Head Start (depi nesans rive 3 an)",p2:"Head Start (3 a 5 an)",p3:"Early Head Start, ki ka sèvi fanm ansent",p4:"Early Head Start (rive 3 an) oswa Head Start (3 a 5 an)",
dh:"Papye pou rasanble",dp:"Make yo lè w jwenn yo. Ou pa bezwen yo tout pou kòmanse. Pwogram yo ka mande lòt fòm tou.",
d1:["Prèv laj pitit ou.","Nenpòt youn: batistè, kanè vaksen, kat oswa lèt asirans, oswa paspò. Si w pa genyen youn, di pwogram nan. Yo pa oblije mande prèv laj si sa se yon baryè."],
d2:["Prèv ou nan lojman tanporè.","Yon deklarasyon ekri nan men yon abri, yon ajans sèvis, oswa yon anplwaye lekòl, oswa yon deklarasyon ou siyen."],
d3:["Prèv swen adoptif.","Yon òdonans tribinal, yon dokiman gouvènman an, oswa prèv peman pou swen adoptif."],
d4:["Prèv avantaj yo.","Yon lèt avantaj oswa lèt apwobasyon pou èd lajan kach (TANF), SNAP, oswa SSI, oswa yon kopi kat ou ki montre w enskri."],
d5:["Prèv revni.","Nenpòt ki aplike: fòm taks (1040 oswa W-2), resi salè resan, yon deklarasyon ekri nan men patwon w, papye chomaj, Sekirite Sosyal, oswa dosye pansyon pou timoun oswa alimony. Si w pa gen revni, mande pwogram nan kijan pou ekri yon deklarasyon ki di sa."],
d6:["Prèv depans lojman.","Pa egzanp yon kontra lwaye, resi lwaye, oswa yon relve ipotèk."],

disc:"Gid sa a bay enfòmasyon jeneral. Se chak pwogram Head Start ki pran desizyon final. Anyen ou antre isit la pa sove ni voye okenn kote."},zh:{"t1":"紐約市 Head Start","sub":"了解您的家庭是否可能符合資格，以及需要準備哪些文件。","priv":"<strong>您的隱私：</strong>我們不會詢問您的姓名、地址、社會安全號碼或移民身份。申請 Head Start 或 Early Head Start 時，不需要出示公民身份或移民身份證明。","s0h":"一步一步來檢查","s0p":"大約需要 2 分鐘。我們會問孩子的年齡、家庭情況和收入。","start":"開始","back":"上一步","next":"下一步","ah":"您的孩子幾歲？","pick":"請選一項","u3":"未滿 3 歲","a35":"3 至 5 歲","ex":"我正在懷孕","un":"不確定","eA":"請選擇一個答案。","sh":"以下哪項符合您的家庭情況？","sp":"可多選。只要符合其中一項，無論收入多少，孩子都可能符合資格。","temp":"我們住在臨時住房或庇護所，或沒有穩定住處","foster":"孩子在寄養家庭","ben":"我們領取現金援助、SNAP（食品券）或 SSI","none":"以上皆非，或我不確定","ih":"家庭收入","ip":"請計算與您同住並共用收入的所有人，包括孩子。","sz":"您家有幾個人？","ch":"請選擇","more":"或以上","il":"您家一年的收入大約多少（扣稅前）？","iph":"沒有收入請填 0","h30":"我們把超過 30% 的收入花在房租或住房上","eI":"請選擇家庭人數並填寫年收入（可填 0）。","see":"查看結果","rh":"您的結果","wt":"住在臨時住房","wf":"有孩子在寄養家庭","wb":"領取現金援助、SNAP 或 SSI","okc":"<strong>您的家庭可能符合資格。</strong>原因：{w}。處於這種情況的家庭，無論收入多少都可能符合資格。","oki":"<strong>您的家庭可能符合資格。</strong>{s} 人家庭的收入上限為每年 {l}，您的收入在此上限或以下。","okh":"<strong>您的家庭可能仍然符合資格。</strong>您的收入超過 {s} 人家庭 {l} 的上限，但計劃可以扣除超過收入 30% 的住房費用。請帶上住房支出的證明。","wc":"<strong>您接近收入上限。</strong>{s} 人家庭的上限為 {l}。有些計劃可能有名額給略高於上限的家庭。請致電詢問。","wo":"<strong>您的收入超過上限</strong>（{s} 人家庭為 {l}）。計劃可以招收少數超過上限的家庭，所以仍值得詢問。紐約市免費的 3-K 和 Pre-K 開放給所有家庭。","ph":"可能適合的計劃","p1":"Early Head Start（出生至 3 歲）","p2":"Head Start（3 至 5 歲）","p3":"Early Head Start（也可服務孕婦）","p4":"Early Head Start（出生至 3 歲）或 Head Start（3 至 5 歲）","dh":"需要準備的文件","dp":"找到後請打勾。不需要全部備齊才能開始。計劃也可能要求其他表格。","d1":["孩子的年齡證明。"],"d2":["住在臨時住房的證明。"],"d3":["寄養證明。"],"d4":["福利證明。"],"d5":["收入證明。"],"d6":["住房支出證明。"],"np":"<strong>沒有文件？</strong>不要放棄。文件不全時，計劃有其他核實方式，例如簽名聲明或了解您情況的人寫的信。如果住在臨時住房，可以要求多一點時間。","nh":"下一步","n1":"<strong>尋找您附近的計劃。</strong>使用 <a href=\"https://headstart.gov/how-apply\">Head Start Center Locator</a>（英文），或致電 1-866-763-6481 或 311。","n2":"<strong>打電話詢問：</strong>「你們有適合我孩子年齡的名額嗎？有候補名單嗎？申請和入學需要哪些文件，例如健康表格？」名額經常變動，只有打電話才知道。","n3":"<strong>申請不止一個計劃，</strong>並盡量登記所有候補名單。","n4":"<strong>把文件放在同一個資料夾，</strong>有名額時才能迅速行動。","n5":"<strong>也請看看 3-K 和 Pre-K，</strong>紐約市兒童免費，可能更快有名額。","pr":"列印或儲存此清單","rs":"重新開始","got":"我找到了","disc":"本指南提供一般資訊。最終由各 Head Start 計劃決定。您在此輸入的內容不會被儲存或傳送到任何地方。","wh":"您附近的計劃","wz":"輸入郵遞區號，查看最近的計劃。","wzp":"郵遞區號","wf2":"尋找計劃","wbad":"請輸入 5 位數郵遞區號。","wnyc":"此名單只涵蓋紐約市。請使用下一步中的 Head Start Center Locator。","wnone":"名單中找不到符合的計劃。請使用下一步中的 Head Start Center Locator。","wcall":"致電","wapp":"申請請致電","wdir":"路線","wnop":"沒有電話號碼。請使用 Center Locator。","wmore":"顯示更多","wcaut":"依郵遞區號由近到遠。去之前請先致電。此名單不包含空缺名額、開放時間和使用語言，資料也可能已過時。"},bn:{"t1":"নিউ ইয়র্ক সিটিতে Head Start","sub":"আপনার পরিবার যোগ্য হতে পারে কি না এবং কী কাগজপত্র জোগাড় করতে হবে তা জানুন।","priv":"<strong>আপনার গোপনীয়তা:</strong> আমরা আপনার নাম, ঠিকানা, সোশ্যাল সিকিউরিটি নম্বর বা অভিবাসন অবস্থা জিজ্ঞাসা করব না। Head Start বা Early Head Start-এ আবেদন করতে নাগরিকত্ব বা অভিবাসন অবস্থার প্রমাণ চাওয়া হবে না।","s0h":"ধাপে ধাপে দেখে নিই","s0p":"এতে প্রায় ২ মিনিট লাগবে। আমরা আপনার সন্তানের বয়স, আপনার পরিস্থিতি ও আয় সম্পর্কে জিজ্ঞাসা করব।","start":"শুরু করুন","back":"পেছনে","next":"পরের ধাপ","ah":"আপনার সন্তানের বয়স কত?","pick":"একটি বেছে নিন","u3":"৩ বছরের কম","a35":"৩ থেকে ৫ বছর","ex":"আমি সন্তানসম্ভবা","un":"নিশ্চিত নই","eA":"অনুগ্রহ করে একটি উত্তর বেছে নিন।","sh":"এগুলোর কোনোটি কি আপনার পরিবারের ক্ষেত্রে প্রযোজ্য?","sp":"যা যা প্রযোজ্য সব বেছে নিন। কোনোটি প্রযোজ্য হলে আয় যা-ই হোক, আপনার সন্তান যোগ্য হতে পারে।","temp":"আমরা অস্থায়ী আবাসনে বা আশ্রয়কেন্দ্রে থাকি, অথবা আমাদের স্থায়ী থাকার জায়গা নেই","foster":"শিশুটি ফস্টার কেয়ারে আছে","ben":"আমরা নগদ সহায়তা, SNAP (ফুড স্ট্যাম্প) বা SSI পাই","none":"এগুলোর কোনোটিই নয়, অথবা আমি নিশ্চিত নই","ih":"পরিবারের আয়","ip":"আপনার সঙ্গে যারা থাকে ও আয় ভাগ করে, শিশুসহ তাদের সবাইকে গণনা করুন।","sz":"আপনার পরিবারে কতজন আছেন?","ch":"বেছে নিন","more":"বা বেশি","il":"কর কাটার আগে আপনার পরিবারের বছরে মোটামুটি কত আয়?","iph":"আয় না থাকলে ০ লিখুন","h30":"আমরা আয়ের ৩০%-এর বেশি ভাড়া বা আবাসনে খরচ করি","eI":"অনুগ্রহ করে পরিবারের সদস্যসংখ্যা বেছে নিন এবং বার্ষিক আয় লিখুন (০ হলেও চলবে)।","see":"ফলাফল দেখুন","rh":"আপনার ফলাফল","wt":"অস্থায়ী আবাসনে বাস","wf":"ফস্টার কেয়ারে থাকা শিশু","wb":"নগদ সহায়তা, SNAP বা SSI পাওয়া","okc":"<strong>আপনার পরিবার যোগ্য হতে পারে।</strong> কারণ: {w}। এমন পরিস্থিতিতে থাকা পরিবার আয় যা-ই হোক যোগ্য হতে পারে।","oki":"<strong>আপনার পরিবার যোগ্য হতে পারে।</strong> {s} জনের পরিবারের জন্য বছরে আয়ের সীমা {l}। আপনার আয় এই সীমার সমান বা কম।","okh":"<strong>আপনার পরিবার তবুও যোগ্য হতে পারে।</strong> {s} জনের পরিবারের জন্য আপনার আয় {l} সীমার বেশি, কিন্তু আয়ের ৩০%-এর বেশি আবাসন খরচ প্রোগ্রামগুলো বাদ দিতে পারে। আবাসনে কত খরচ করেন তার প্রমাণ আনুন।","wc":"<strong>আপনি সীমার কাছাকাছি।</strong> {s} জনের পরিবারের সীমা {l}। সীমার সামান্য উপরের পরিবারের জন্য কিছু প্রোগ্রামে জায়গা থাকতে পারে। ফোন করে জিজ্ঞাসা করুন।","wo":"<strong>আপনার আয় সীমার বেশি</strong> ({s} জনের পরিবারের জন্য {l})। প্রোগ্রামগুলো সীমার ওপরের অল্প কিছু পরিবারকে ভর্তি করতে পারে, তাই জিজ্ঞাসা করা উচিত। নিউ ইয়র্ক সিটির বিনামূল্যের 3-K ও Pre-K সব পরিবারের জন্য উন্মুক্ত।","ph":"সম্ভাব্য প্রোগ্রাম","p1":"Early Head Start (জন্ম থেকে ৩ বছর)","p2":"Head Start (৩ থেকে ৫ বছর)","p3":"Early Head Start, যা সন্তানসম্ভবা নারীদেরও সেবা দিতে পারে","p4":"Early Head Start (৩ বছর পর্যন্ত) বা Head Start (৩ থেকে ৫ বছর)","dh":"যে কাগজপত্র জোগাড় করবেন","dp":"পেলে টিক দিন। শুরু করতে সবগুলো লাগবে না। প্রোগ্রাম অন্য ফর্মও চাইতে পারে।","d1":["সন্তানের বয়সের প্রমাণ।"],"d2":["অস্থায়ী আবাসনে থাকার প্রমাণ।"],"d3":["ফস্টার কেয়ারের প্রমাণ।"],"d4":["সুবিধা পাওয়ার প্রমাণ।"],"d5":["আয়ের প্রমাণ।"],"d6":["আবাসন খরচের প্রমাণ।"],"np":"<strong>কাগজপত্র নেই?</strong> থেমে যাবেন না। কাগজ না থাকলে প্রোগ্রামগুলোর যাচাইয়ের অন্য উপায় আছে, যেমন সই করা বিবৃতি বা আপনার পরিস্থিতি জানেন এমন কারও চিঠি। অস্থায়ী আবাসনে থাকলে বাড়তি সময় চান।","nh":"পরবর্তী পদক্ষেপ","n1":"<strong>কাছের প্রোগ্রাম খুঁজুন।</strong> <a href=\"https://headstart.gov/how-apply\">Head Start Center Locator</a> (ইংরেজিতে) ব্যবহার করুন, অথবা 1-866-763-6481 বা 311 নম্বরে ফোন করুন।","n2":"<strong>ফোন করে জিজ্ঞাসা করুন:</strong> «আমার সন্তানের বয়সের জন্য কি জায়গা আছে? ওয়েটলিস্ট আছে কি? আবেদন করতে এবং ভর্তি হতে কোন কাগজ লাগবে, যেমন স্বাস্থ্য ফর্ম?» সিট প্রায়ই বদলায়, তাই ফোন করেই জানতে হয়।","n3":"<strong>একাধিক প্রোগ্রামে আবেদন করুন</strong> এবং যতগুলো সম্ভব ওয়েটলিস্টে নাম লেখান।","n4":"<strong>কাগজপত্র একটি ফোল্ডারে রাখুন,</strong> যাতে জায়গা খালি হলে দ্রুত কাজ করতে পারেন।","n5":"<strong>3-K ও Pre-K-ও দেখুন,</strong> যা নিউ ইয়র্ক সিটির শিশুদের জন্য বিনামূল্যে এবং হয়তো আগেই জায়গা পাওয়া যাবে।","pr":"এই তালিকা প্রিন্ট বা সেভ করুন","rs":"আবার শুরু করুন","got":"পেয়েছি","disc":"এই গাইড সাধারণ তথ্য দেয়। চূড়ান্ত সিদ্ধান্ত প্রতিটি Head Start প্রোগ্রামের। আপনি এখানে যা লিখবেন তা কোথাও সেভ বা পাঠানো হয় না।","wh":"আপনার কাছের প্রোগ্রাম","wz":"সবচেয়ে কাছের প্রোগ্রাম দেখতে আপনার জিপ কোড লিখুন।","wzp":"জিপ কোড","wf2":"প্রোগ্রাম খুঁজুন","wbad":"অনুগ্রহ করে ৫ অঙ্কের জিপ কোড লিখুন।","wnyc":"এই তালিকা শুধু নিউ ইয়র্ক সিটির জন্য। পরবর্তী পদক্ষেপে Head Start Center Locator ব্যবহার করুন।","wnone":"আমাদের তালিকায় মিল পাওয়া যায়নি। পরবর্তী পদক্ষেপে Head Start Center Locator ব্যবহার করুন।","wcall":"ফোন করুন","wapp":"আবেদনের জন্য ফোন করুন","wdir":"দিকনির্দেশ","wnop":"কোনো ফোন নম্বর নেই। Center Locator ব্যবহার করুন।","wmore":"আরও দেখুন","wcaut":"জিপ কোড অনুযায়ী কাছেরটি আগে। যাওয়ার আগে ফোন করুন। খালি আসন, সময় ও কোন ভাষায় কথা বলা হয় তা এই তালিকায় নেই, এবং তথ্য পুরোনো হতে পারে।"},ru:{"t1":"Head Start в Нью-Йорке","sub":"Узнайте, может ли ваша семья иметь право на участие и какие документы собрать.","priv":"<strong>Ваша конфиденциальность:</strong> Мы не будем спрашивать ваше имя, адрес, номер социального страхования или иммиграционный статус. Для заявки в Head Start или Early Head Start подтверждение гражданства или иммиграционного статуса не требуется.","s0h":"Проверим шаг за шагом","s0p":"Это займёт около 2 минут. Мы спросим о возрасте ребёнка, вашей ситуации и доходе.","start":"Начать","back":"Назад","next":"Далее","ah":"Сколько лет вашему ребёнку?","pick":"Выберите один вариант","u3":"Младше 3 лет","a35":"От 3 до 5 лет","ex":"Я жду ребёнка","un":"Не уверен(а)","eA":"Пожалуйста, выберите ответ.","sh":"Подходит ли вашей семье что-то из этого?","sp":"Отметьте всё, что подходит. Если что-то подходит, ваш ребёнок может иметь право независимо от дохода.","temp":"Мы живём во временном жилье, в приюте или у нас нет постоянного места","foster":"Ребёнок находится в приёмной семье (foster care)","ben":"Мы получаем денежную помощь, SNAP (продуктовые талоны) или SSI","none":"Ничего из этого или я не уверен(а)","ih":"Доход семьи","ip":"Посчитайте всех, кто живёт с вами и делит доходы, включая ребёнка.","sz":"Сколько человек в вашей семье?","ch":"Выберите","more":"или больше","il":"Примерно сколько зарабатывает ваша семья за год до вычета налогов?","iph":"Введите 0, если дохода нет","h30":"Мы тратим больше 30% дохода на аренду или жильё","eI":"Пожалуйста, выберите размер семьи и введите годовой доход (0 допустим).","see":"Показать результаты","rh":"Ваши результаты","wt":"проживание во временном жилье","wf":"ребёнок в приёмной семье","wb":"получение денежной помощи, SNAP или SSI","okc":"<strong>Ваша семья может иметь право.</strong> Причина: {w}. Семьи в такой ситуации могут иметь право независимо от дохода.","oki":"<strong>Ваша семья может иметь право.</strong> Для семьи из {s} чел. предел дохода — {l} в год. Ваш доход не превышает его.","okh":"<strong>Ваша семья всё ещё может иметь право.</strong> Ваш доход выше предела {l} для семьи из {s} чел., но программы могут вычесть расходы на жильё сверх 30% дохода. Принесите подтверждение расходов на жильё.","wc":"<strong>Вы близко к пределу.</strong> Предел для семьи из {s} чел. — {l}. В некоторых программах могут быть места для семей, немного превышающих его. Позвоните и спросите.","wo":"<strong>Ваш доход выше предела</strong> ({l} для семьи из {s} чел.). Программы могут принять небольшое число семей сверх предела, поэтому спросить стоит. Бесплатные 3-K и Pre-K в Нью-Йорке открыты для всех семей.","ph":"Вероятная программа","p1":"Early Head Start (от рождения до 3 лет)","p2":"Head Start (от 3 до 5 лет)","p3":"Early Head Start, где могут помогать и беременным женщинам","p4":"Early Head Start (до 3 лет) или Head Start (от 3 до 5 лет)","dh":"Документы для сбора","dp":"Отмечайте их, когда найдёте. Для начала нужны не все. Программы могут попросить и другие формы.","d1":["Подтверждение возраста ребёнка."],"d2":["Подтверждение проживания во временном жилье."],"d3":["Подтверждение приёмной семьи."],"d4":["Подтверждение пособий."],"d5":["Подтверждение дохода."],"d6":["Подтверждение расходов на жильё."],"np":"<strong>Нет документов?</strong> Не останавливайтесь. У программ есть способы проверки, когда документов не хватает, например подписанное заявление или письмо от человека, знающего вашу ситуацию. Если вы во временном жилье, попросите дополнительное время.","nh":"Следующие шаги","n1":"<strong>Найдите программы рядом.</strong> Используйте <a href=\"https://headstart.gov/how-apply\">Head Start Center Locator</a> (на английском) или позвоните по номеру 1-866-763-6481 или 311.","n2":"<strong>Позвоните и спросите:</strong> «Есть ли место для ребёнка такого возраста? Есть ли список ожидания? Какие документы нужны для заявки и для зачисления, например медицинские формы?» Места меняются часто, поэтому узнать можно только звонком.","n3":"<strong>Подавайте заявки в несколько программ</strong> и вставайте во все списки ожидания.","n4":"<strong>Храните документы в одной папке,</strong> чтобы действовать быстро, когда появится место.","n5":"<strong>Посмотрите также 3-K и Pre-K:</strong> они бесплатны для детей Нью-Йорка, и места могут появиться раньше.","pr":"Распечатать или сохранить список","rs":"Начать заново","got":"Нашёл(ла)","disc":"Это руководство даёт общую информацию. Окончательное решение принимает каждая программа Head Start. Введённые данные нигде не сохраняются и никуда не отправляются.","wh":"Программы рядом с вами","wz":"Введите почтовый индекс, чтобы увидеть ближайшие программы.","wzp":"Индекс","wf2":"Найти программы","wbad":"Введите 5-значный почтовый индекс.","wnyc":"Этот список охватывает только Нью-Йорк. Используйте Head Start Center Locator из следующих шагов.","wnone":"В нашем списке нет подходящих программ. Используйте Head Start Center Locator из следующих шагов.","wcall":"Позвонить","wapp":"Для заявки звоните","wdir":"Маршрут","wnop":"Номера телефона нет. Используйте Center Locator.","wmore":"Показать ещё","wcaut":"Сначала ближайшие, по почтовому индексу. Позвоните перед визитом. Свободные места, часы работы и языки в этом списке не указаны, а данные могут быть устаревшими."},ar:{"t1":"Head Start في مدينة نيويورك","sub":"اعرف إن كانت أسرتك قد تكون مؤهلة وما الأوراق التي عليك تجهيزها.","priv":"<strong>خصوصيتك:</strong> لن نسألك عن اسمك أو عنوانك أو رقم الضمان الاجتماعي أو وضعك في الهجرة. لن يُطلب منك إثبات الجنسية أو وضع الهجرة عند التقديم إلى Head Start أو Early Head Start.","s0h":"لنتحقق خطوة بخطوة","s0p":"يستغرق ذلك نحو دقيقتين. سنسأل عن عمر طفلك ووضع أسرتك ودخلك.","start":"ابدأ","back":"رجوع","next":"التالي","ah":"كم عمر طفلك؟","pick":"اختر إجابة واحدة","u3":"أقل من 3 سنوات","a35":"من 3 إلى 5 سنوات","ex":"أنا حامل","un":"لست متأكدًا","eA":"يرجى اختيار إجابة.","sh":"هل ينطبق عليك شيء مما يلي؟","sp":"اختر كل ما ينطبق. إذا انطبق أحدها فقد يكون طفلك مؤهلًا مهما كان دخلك.","temp":"نعيش في سكن مؤقت أو ملجأ، أو ليس لدينا مكان إقامة مستقر","foster":"الطفل في رعاية بديلة (foster care)","ben":"نحصل على مساعدة نقدية أو SNAP (قسائم الغذاء) أو SSI","none":"لا شيء مما سبق، أو لست متأكدًا","ih":"دخل الأسرة","ip":"احسب كل من يعيش معك ويشاركك الدخل، بمن فيهم الطفل.","sz":"كم عدد أفراد أسرتك؟","ch":"اختر","more":"أو أكثر","il":"كم يبلغ دخل أسرتك تقريبًا في السنة قبل الضرائب؟","iph":"اكتب 0 إذا لم يكن هناك دخل","h30":"ننفق أكثر من 30% من دخلنا على الإيجار أو السكن","eI":"يرجى اختيار عدد أفراد الأسرة وإدخال الدخل السنوي (يُقبل 0).","see":"عرض النتائج","rh":"نتائجك","wt":"العيش في سكن مؤقت","wf":"طفل في رعاية بديلة","wb":"الحصول على مساعدة نقدية أو SNAP أو SSI","okc":"<strong>قد تكون أسرتك مؤهلة.</strong> السبب: {w}. يمكن للأسر في هذا الوضع أن تكون مؤهلة مهما كان دخلها.","oki":"<strong>قد تكون أسرتك مؤهلة.</strong> بالنسبة لأسرة من {s} أفراد، حد الدخل {l} في السنة. دخلك عند هذا الحد أو أقل منه.","okh":"<strong>قد تظل أسرتك مؤهلة.</strong> دخلك أعلى من الحد {l} لأسرة من {s} أفراد، لكن البرامج يمكنها خصم تكاليف السكن التي تتجاوز 30% من الدخل. أحضر ما يثبت ما تدفعه للسكن.","wc":"<strong>أنت قريب من الحد.</strong> الحد لأسرة من {s} أفراد هو {l}. قد يكون لدى بعض البرامج مكان لأسر تتجاوزه قليلًا. اتصل واسأل.","wo":"<strong>دخلك أعلى من الحد</strong> ({l} لأسرة من {s} أفراد). يمكن للبرامج قبول عدد قليل من الأسر فوق الحد، لذا يستحق الأمر السؤال. برنامجا 3-K وPre-K المجانيان في نيويورك مفتوحان لجميع الأسر.","ph":"البرنامج المحتمل","p1":"Early Head Start (من الولادة حتى 3 سنوات)","p2":"Head Start (من 3 إلى 5 سنوات)","p3":"Early Head Start، الذي يمكنه خدمة الحوامل أيضًا","p4":"Early Head Start (حتى 3 سنوات) أو Head Start (من 3 إلى 5 سنوات)","dh":"أوراق عليك تجهيزها","dp":"ضع علامة عند العثور عليها. لا تحتاج إلى كلها للبدء. وقد تطلب البرامج نماذج أخرى.","d1":["إثبات عمر طفلك."],"d2":["إثبات السكن المؤقت."],"d3":["إثبات الرعاية البديلة."],"d4":["إثبات المزايا."],"d5":["إثبات الدخل."],"d6":["إثبات تكاليف السكن."],"np":"<strong>ليست لديك أوراق؟</strong> لا تتوقف. لدى البرامج طرق للتحقق عند غياب المستندات، مثل إفادة موقّعة أو رسالة من شخص يعرف وضعك. وإذا كنت في سكن مؤقت فاطلب وقتًا إضافيًا.","nh":"الخطوات التالية","n1":"<strong>ابحث عن برامج قريبة منك.</strong> استخدم <a href=\"https://headstart.gov/how-apply\">Head Start Center Locator</a> (بالإنجليزية)، أو اتصل بالرقم 1-866-763-6481 أو 311.","n2":"<strong>اتصل واسأل:</strong> «هل لديكم مكان لعمر طفلي؟ هل توجد قائمة انتظار؟ ما الأوراق المطلوبة للتقديم وللتسجيل، مثل النماذج الصحية؟» تتغير الأماكن كثيرًا، فالاتصال هو الطريقة الوحيدة للمعرفة.","n3":"<strong>قدّم على أكثر من برنامج</strong> وسجّل في كل قوائم الانتظار الممكنة.","n4":"<strong>احتفظ بأوراقك في ملف واحد</strong> لتتصرف بسرعة عند توفر مكان.","n5":"<strong>انظر أيضًا في 3-K وPre-K،</strong> وهما مجانيان لأطفال نيويورك وقد تتوفر فيهما أماكن أسرع.","pr":"اطبع القائمة أو احفظها","rs":"ابدأ من جديد","got":"وجدتها","disc":"يقدم هذا الدليل معلومات عامة. القرار النهائي لكل برنامج Head Start. لا يُحفظ أي شيء تدخله هنا ولا يُرسل إلى أي مكان.","wh":"برامج قريبة منك","wz":"أدخل الرمز البريدي لعرض أقرب البرامج.","wzp":"الرمز البريدي","wf2":"ابحث عن برامج","wbad":"يرجى إدخال رمز بريدي من 5 أرقام.","wnyc":"تغطي هذه القائمة مدينة نيويورك فقط. استخدم Head Start Center Locator في الخطوات التالية.","wnone":"لم نجد برامج مطابقة في قائمتنا. استخدم Head Start Center Locator في الخطوات التالية.","wcall":"اتصل","wapp":"للتقديم اتصل","wdir":"الاتجاهات","wnop":"لا يوجد رقم هاتف. استخدم Center Locator.","wmore":"عرض المزيد","wcaut":"الأقرب أولًا حسب الرمز البريدي. اتصل قبل الذهاب. الأماكن الشاغرة وساعات العمل واللغات المستخدمة غير مذكورة في هذه القائمة، وقد تكون البيانات قديمة."},ko:{"t1":"뉴욕시 Head Start","sub":"가족이 자격이 될 수 있는지, 그리고 어떤 서류를 준비해야 하는지 알아보세요.","priv":"<strong>개인정보 보호:</strong> 이름, 주소, 사회보장번호, 이민 신분은 묻지 않습니다. Head Start 또는 Early Head Start에 신청할 때 시민권이나 이민 신분 증명은 요구되지 않습니다.","s0h":"단계별로 확인해 볼게요","s0p":"약 2분 걸립니다. 자녀의 나이, 가족 상황, 소득을 여쭤봅니다.","start":"시작","back":"이전","next":"다음","ah":"자녀의 나이는 몇 살인가요?","pick":"하나를 선택하세요","u3":"3세 미만","a35":"3~5세","ex":"임신 중입니다","un":"잘 모르겠어요","eA":"답을 하나 선택해 주세요.","sh":"다음 중 우리 가족에 해당하는 것이 있나요?","sp":"해당하는 것을 모두 선택하세요. 하나라도 해당하면 소득과 관계없이 자격이 될 수 있습니다.","temp":"임시 주거지나 쉼터에서 살고 있거나 안정된 거처가 없습니다","foster":"아이가 위탁 가정(foster care)에 있습니다","ben":"현금 지원, SNAP(푸드 스탬프) 또는 SSI를 받고 있습니다","none":"해당 없음, 또는 잘 모르겠어요","ih":"가구 소득","ip":"함께 살면서 소득을 나누는 모든 사람을 아이를 포함해 세어 주세요.","sz":"가구원은 모두 몇 명인가요?","ch":"선택","more":"명 이상","il":"세금을 내기 전 가구의 연 소득은 대략 얼마인가요?","iph":"소득이 없으면 0 입력","h30":"소득의 30% 넘게 월세나 주거비로 씁니다","eI":"가구원 수를 선택하고 연 소득을 입력해 주세요(0도 가능).","see":"결과 보기","rh":"결과","wt":"임시 주거지 거주","wf":"위탁 가정에 있는 아이","wb":"현금 지원, SNAP 또는 SSI 수급","okc":"<strong>가족이 자격이 될 수 있습니다.</strong> 이유: {w}. 이런 상황의 가족은 소득과 관계없이 자격이 될 수 있습니다.","oki":"<strong>가족이 자격이 될 수 있습니다.</strong> {s}인 가구의 소득 한도는 연 {l}입니다. 귀하의 소득은 이 한도 이하입니다.","okh":"<strong>그래도 자격이 될 수 있습니다.</strong> 소득이 {s}인 가구 한도 {l}을 넘지만, 프로그램은 소득의 30%를 넘는 주거비를 공제할 수 있습니다. 주거비 지출 증빙을 가져오세요.","wc":"<strong>소득 한도에 가깝습니다.</strong> {s}인 가구의 한도는 {l}입니다. 한도를 조금 넘는 가족을 위한 자리가 있는 프로그램도 있을 수 있습니다. 전화로 문의하세요.","wo":"<strong>소득이 한도를 넘습니다</strong>({s}인 가구 {l}). 프로그램이 한도를 넘는 소수의 가족을 받을 수 있으니 문의해 볼 만합니다. 뉴욕시의 무료 3-K와 Pre-K는 모든 가족이 이용할 수 있습니다.","ph":"가능성이 높은 프로그램","p1":"Early Head Start(출생~3세)","p2":"Head Start(3~5세)","p3":"Early Head Start(임산부도 지원 가능)","p4":"Early Head Start(3세까지) 또는 Head Start(3~5세)","dh":"준비할 서류","dp":"찾으면 체크하세요. 시작하는 데 모두 필요하지는 않습니다. 프로그램에서 다른 양식을 요청할 수도 있습니다.","d1":["자녀의 나이 증빙."],"d2":["임시 주거지 거주 증빙."],"d3":["위탁 양육 증빙."],"d4":["수급 증빙."],"d5":["소득 증빙."],"d6":["주거비 증빙."],"np":"<strong>서류가 없나요?</strong> 포기하지 마세요. 서류가 부족할 때 프로그램에는 서명한 진술서나 상황을 아는 사람의 편지 같은 확인 방법이 있습니다. 임시 주거지에 계시면 시간을 더 달라고 요청하세요.","nh":"다음 단계","n1":"<strong>가까운 프로그램을 찾으세요.</strong> <a href=\"https://headstart.gov/how-apply\">Head Start Center Locator</a>(영어)를 이용하거나 1-866-763-6481 또는 311로 전화하세요.","n2":"<strong>전화해서 물어보세요:</strong> “우리 아이 나이에 자리가 있나요? 대기자 명단이 있나요? 신청과 등록에 어떤 서류가 필요한가요(예: 건강 양식)?” 자리는 자주 바뀌므로 전화로만 알 수 있습니다.","n3":"<strong>여러 프로그램에 신청하고</strong> 가능한 모든 대기자 명단에 올리세요.","n4":"<strong>서류를 한 폴더에 모아 두세요.</strong> 자리가 나면 빨리 움직일 수 있습니다.","n5":"<strong>3-K와 Pre-K도 알아보세요.</strong> 뉴욕시 아동에게 무료이며 더 빨리 자리가 날 수 있습니다.","pr":"목록 인쇄 또는 저장","rs":"처음부터 다시","got":"찾았어요","disc":"이 안내는 일반 정보입니다. 최종 결정은 각 Head Start 프로그램이 합니다. 여기에 입력한 내용은 저장되거나 어디로도 전송되지 않습니다.","wh":"가까운 프로그램","wz":"우편번호를 입력하면 가장 가까운 프로그램을 보여 드립니다.","wzp":"우편번호","wf2":"프로그램 찾기","wbad":"5자리 우편번호를 입력해 주세요.","wnyc":"이 목록은 뉴욕시만 다룹니다. 다음 단계의 Head Start Center Locator를 이용하세요.","wnone":"목록에서 맞는 프로그램을 찾지 못했습니다. 다음 단계의 Head Start Center Locator를 이용하세요.","wcall":"전화","wapp":"신청은 전화","wdir":"길찾기","wnop":"전화번호가 없습니다. Center Locator를 이용하세요.","wmore":"더 보기","wcaut":"우편번호 기준으로 가까운 순입니다. 가기 전에 전화하세요. 빈자리, 운영 시간, 사용 언어는 이 목록에 없으며 정보가 오래되었을 수 있습니다."}};
